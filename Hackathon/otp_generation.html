<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Keypad</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e3f2fd;
            font-family: 'Arial', sans-serif;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #1976d2;
            font-size: 28px;
            margin-bottom: 20px;
        }
        .display {
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 20px;
            border: 1px solid #90caf9;
            border-radius: 12px;
            background: #e3f2fd;
            color: #0d47a1;
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background: #64b5f6;
            color: #ffffff;
            transition: background 0.3s ease, transform 0.1s ease;
        }
        button:hover {
            background: #42a5f5;
            transform: scale(1.1);

        }
        button:active, .highlight {
            background: #1e88e5;
        }
        .wide-button {
            grid-column: span 2;
        }
        #toggleMode {
            background: transparent;
            transition: transform 0.3s ease-in, background-color 0.3s ease-in;
        }
        #toggleMode:hover {
            transform: scale(1.1);
         
        }
        #message {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
        .dark-mode {
            background-color: #263238;
            color: #ffffff;
        }
        .dark-mode .container {
            background: #37474f;
        }
        .dark-mode input[type="text"] {
            background: #455a64;
            color: #ffffff;
        }
        .dark-mode button {
            background: #29b6f6;
        }
        .dark-mode button:hover {
            background: #0288d1;
        }
    </style>

</head>
<body onkeydown="return false;">
    <div class="container">
        <h1>Secure Keypad Access</h1>
        <button id="toggleMode" class="dark-mode" onclick="toggleTheme()"><img height=30px src="dark-theme.svg" alt=""></button>

        <div class="display">
            <label>Password<br>
            <input type="text" id="password" disabled></label>
            <br>
            <label>User input<br>
            <input type="text" id="userInput" disabled></label>
            <div id="message"></div>
        </div>
        <div class="keypad" id="keypad"></div>
    </div>

    <script>
        const keypad = document.getElementById('keypad');
        const userInput = document.getElementById('userInput');
        const passwordField = document.getElementById('password');
        const message = document.getElementById('message');

        function generatePassword() {
            const chars = '0123456789!@#$%^&*';
            let password = '';
            for (let i = 0; i < 6; i++) {
                password += chars[Math.floor(Math.random() * chars.length)];
            }
            passwordField.value = password;
        }

        function highlightButton(button) {
            button.classList.add('highlight');
            setTimeout(() => button.classList.remove('highlight'), 200);
        }

        function shuffleCharacters() {
            const characters = ['1','2','3','4','5','6','7','8','9','0','!','@','#','$','%','^','&','*'];
            const shuffled = characters.sort(() => Math.random() - 0.5);

            keypad.innerHTML = '';
            shuffled.forEach(char => {
                const button = document.createElement('button');
                button.textContent = char;
                button.onclick = () => {
                    userInput.value += char;
                    highlightButton(button);
                };
                keypad.appendChild(button);
            });

            const clearButton = document.createElement('button');
            clearButton.textContent = 'Clear';
            clearButton.classList.add('wide-button');
            clearButton.onclick = () => {
                userInput.value = '';
                message.textContent = '';
                highlightButton(clearButton);
            };
            keypad.appendChild(clearButton);

            const backspaceButton = document.createElement('button');
            backspaceButton.textContent = 'Backspace';
            backspaceButton.classList.add('wide-button');
            backspaceButton.onclick = () => {
                userInput.value = userInput.value.slice(0, -1);
                highlightButton(backspaceButton);
            };
            keypad.appendChild(backspaceButton);

            const enterButton = document.createElement('button');
            enterButton.textContent = 'Enter';
            enterButton.classList.add('wide-button');
            enterButton.onclick = () => {
                if (userInput.value === passwordField.value) {
                    message.textContent = 'Access granted!';
                    message.style.color = 'green';
                    shuffleCharacters();
                    generatePassword();
                } else {
                    message.textContent = 'Incorrect password';
                    message.style.color = 'red';
                }
                userInput.value = '';
                highlightButton(enterButton);
            };
            keypad.appendChild(enterButton);

            generatePassword();
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        shuffleCharacters();
        setInterval(shuffleCharacters, 30000);
    </script>
</body>
</html>
